name: One-time tracking patch (self-cleaning)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-apply-tracking.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch and node-check every script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=s
          original_sha=subprocess.check_output(['git','hash-object','index.html'],text=True).strip()
          if original_sha!='3fe16708b9c63a66894ae0ffb9b06ad82b0e4a77':
              raise RuntimeError('main/index.html changed since inspection: '+original_sha)
          def rep(a,b):
              global s
              if s.count(a)!=1: raise RuntimeError('anchor not unique: '+a[:70]+' '+str(s.count(a)))
              s=s.replace(a,b,1)
          rep('const TRK36=[];',"""const TRK36=[];
          // 調査・追跡の状態はセーブに入れず、物語の CLUES と分離する。
          const TRK36_TRACK={chainId:0,lastStep:0,chain:0,chainUntil:0,activeId:0,activeUntil:0,markers:[],last:null};
          function trk36Reset(){
            TRK36_TRACK.chainId=0;TRK36_TRACK.lastStep=0;TRK36_TRACK.chain=0;TRK36_TRACK.chainUntil=0;
            TRK36_TRACK.activeId=0;TRK36_TRACK.activeUntil=0;TRK36_TRACK.markers.length=0;TRK36_TRACK.last=null;
          }""")
          rep("function spawnBoarTracks(e){\n  if(TRK36.length>22) return;", "function spawnBoarTracks(e){\n  if(TRK36.length>22) return;\n  const step=e.trk36Step=(e.trk36Step||0)+1;")
          rep("TRK36.push({m,t:0,ttl:300});","TRK36.push({m,t:0,ttl:300,sourceId:e.id,step,kind:e.type,dir:e.rot});")
          helper="""
          // 蹄跡の検索は既存 TRK36 だけ。地面のメッシュは増やさない。
          function trk36Nearby(){
            let fresh=null,used=null,fd=2.3,ud=2.3;
            for(const k of TRK36){
              if(k.torn||!k.sourceId||k.t>=k.ttl)continue;
              const d=dist(P.x,P.z,k.m.position.x,k.m.position.z);
              if(k.checked){if(d<ud){used=k;ud=d;}}
              else if(d<fd){fresh=k;fd=d;}
            }
            return fresh||used;
          }
          function trk36Inspect(k){
            if(!TRK36.includes(k)||k.torn||k.t>=k.ttl||dist(P.x,P.z,k.m.position.x,k.m.position.z)>2.5)return;
            const x=k.m.position.x,z=k.m.position.z,dir=compass(Math.sin(k.dir),Math.cos(k.dir)),first=!k.checked;
            if(first){
              // 同じ獣が残した連続する「組」を追う。4枚を繰り返し調べても進まない。
              for(const t of TRK36)if(t.sourceId===k.sourceId&&t.step===k.step)t.checked=true;
              const r=TRK36_TRACK;
              r.chain=(r.chainId===k.sourceId&&k.step===r.lastStep+1&&S.time<=r.chainUntil)?r.chain+1:1;
              r.chainId=k.sourceId;r.lastStep=k.step;r.chainUntil=S.time+180;
              if(r.chain>=3){
                r.activeId=k.sourceId;r.activeUntil=S.time+180;
                for(const sp of spawnerState)if(sp.e&&sp.e.id===k.sourceId&&sp.type===k.kind){
                  sp.trk36Hint={x,z,until:S.time+300};break;
                }
                toast('追跡中：'+(ET[k.kind]?ET[k.kind].name:k.kind)+'の足取りをつかんだ');
              }
            }
            const mark={x,z,dir:k.dir,kind:k.kind,until:S.time+120},marks=TRK36_TRACK.markers;
            if(marks.length>=8)marks.shift();
            marks.push(mark);TRK36_TRACK.last=mark;
            if(!first)toast('確認済みの蹄跡：'+dir+'方向（地図を更新）');
            else toast((ET[k.kind]?ET[k.kind].name:k.kind)+'の新しい蹄跡：'+dir+'方向（地図に2分表示）');
            sfx('pickup');
          }
          function trk36BonusFor(e){
            if(e.type!=='boar'&&e.type!=='bear')return 0;
            return (TRK36_TRACK.activeId===e.id&&S.time<TRK36_TRACK.activeUntil)||(e.trk36TrackedUntil&&S.time<e.trk36TrackedUntil)?1:0;
          }
          function trk36GenHint(){
            const m=TRK36_TRACK.last;if(!m||m.until<=S.time)return '';
            return ' 直近の'+(ET[m.kind]?ET[m.kind].name:m.kind)+'の蹄跡は、'+compass(Math.sin(m.dir),Math.cos(m.dir))+'の方へ続いとるようや。';
          }
          function trk36Map(c,X,Z,lab){
            // 地図に描くのは調査した地面の向き。生きている獣の座標は使わない。
            for(const m of TRK36_TRACK.markers){
              if(m.until<=S.time)continue;
              const x=X(m.x),y=Z(m.z);
              c.save();c.translate(x,y);c.rotate(Math.PI-m.dir);
              c.fillStyle='#a5e7db';c.strokeStyle='#183931';c.lineWidth=1.5;
              c.beginPath();c.moveTo(0,-10);c.lineTo(6,7);c.lineTo(0,3);c.lineTo(-6,7);c.closePath();c.fill();c.stroke();c.restore();
            }
            const last=TRK36_TRACK.last;
            if(last&&last.until>S.time)lab('痕跡の向き',X(last.x)+10,Z(last.z)-9,'#b5f5e3',11);
          }
          """
          rep("\n// ---- 段階F：遊んでいる時間で回る昼と夜・動的な痕跡・源さんの「今していること」 ----",helper+"\n// ---- 段階F：遊んでいる時間で回る昼と夜・動的な痕跡・源さんの「今していること」 ----")
          rep("  // 近くの獣\n  for(const e of enemies){ if(e.state==='dead'||e.removed) continue;","  // 調査位置だけ表示し、追跡中の獣は元の位置表示からも隠す。\n  trk36Map(c,X,Z,lab);\n  // 近くの獣\n  for(const e of enemies){ if(e.state==='dead'||e.removed||trk36BonusFor(e)) continue;")
          rep("  return {text:L.slice(0,2).join(''),gate}; }\nfunction f9GenPanel","  return {text:L.slice(0,2).join('')+trk36GenHint(),gate}; }\nfunction f9GenPanel")
          rep("  f8Interactables(L); f10Interactables(L);\n  for(const n of NODES)","  f8Interactables(L); f10Interactables(L);\n  const k36=trk36Nearby();if(k36)L.push({d:dist(P.x,P.z,k36.m.position.x,k36.m.position.z),label:'蹄跡を調べる',act:()=>trk36Inspect(k36)});\n  for(const n of NODES)")
          rep("  if(e.hp<=0) killEnemy(e);","  if(e.hp<=0) killEnemy(e,trk36BonusFor(e));")
          rep("function killEnemy(e){","function killEnemy(e,trackingBonus=0){")
          rep("  spawnDrop('hide',n,e.x,e.z);","  spawnDrop('hide',n+(trackingBonus?1:0),e.x,e.z);")
          rep("  for(const s of spawnerState){ s.e=null; s.timer=0; }\n  trackSpawns.length=0;","  for(const s of spawnerState){ s.e=null; s.timer=0; s.trk36Hint=null; }\n  trk36Reset();\n  trackSpawns.length=0;")
          rep("""  // 野生の敵の再出現
            for(const s of spawnerState){
              if(s.e&&!s.e.removed&&s.e.state!=='dead') continue;
              if(s.calm) continue; s.timer+=dt;
              if(s.timer>100&&dist(P.x,P.z,s.x,s.z)>32&&!ev.kind){ s.e=spawnEnemy(s.type,s.x,s.z,'field'); s.timer=0; }
            }""","""  // 野生の敵の再出現：追跡中のみ次の1頭を蹄跡付近へ優先。柵と距離条件は維持。
            for(const s of spawnerState){
              if(s.e&&!s.e.removed&&s.e.state!=='dead') continue;
              if(s.calm) continue; s.timer+=dt;
              const hint=s.trk36Hint,valid=!!(hint&&hint.until>S.time);
              if(s.timer>(valid?75:100)&&dist(P.x,P.z,s.x,s.z)>32&&!ev.kind){
                let x=s.x,z=s.z,near=false;
                if(valid&&Math.random()<0.7){
                  const nx=hint.x+rr(-6,6),nz=hint.z+rr(-6,6);
                  if(dist(P.x,P.z,nx,nz)>32&&!inSafe(nx,nz,6)&&!isWater(nx,nz)){x=nx;z=nz;near=true;}
                }
                s.e=spawnEnemy(s.type,x,z,'field');
                if(near)s.e.trk36TrackedUntil=S.time+180;
                s.trk36Hint=null;s.timer=0;
              }
            }""")
          # 無変更領域のコードを比較。CLUES3個・保存・ボス・旧足跡を維持。
          for start,end in [('const CLUES=[','const SPAWNERS=['),('function examineClue(c){','function placeFence(g,type){'),
          ('function bossDefeated(e){','// ================= 会話'),('function saveGame(){','function readSave()'),
          ('function g4TrackBeast(tr){','function g4Update(dt){')]:
              i=old.find(start);j=old.find(end,i+len(start))
              if i<0 or j<0:raise RuntimeError('stability range not found '+start)
              if old[i:j] not in s:raise RuntimeError('existing code regression '+start)
          p.write_text(s,encoding='utf-8')
          # node --check：6つのscriptタグ中 JSON/外部src以外の4ブロックを個別に構文検証。
          scripts=re.findall(r'<script\b([^>]*)>([\s\S]*?)</script>',s,re.I)
          checked=0
          for attrs,body in scripts:
              if re.search(r'\bsrc\s*=|\btype\s*=\s*["\']application/json',attrs,re.I):continue
              if not body.strip():continue
              with tempfile.NamedTemporaryFile(mode='w',suffix='.js',encoding='utf-8',delete=False) as f:
                  f.write(body);fname=f.name
              subprocess.run(['node','--check',fname],check=True)
              Path(fname).unlink()
              checked+=1
          if checked!=4:raise RuntimeError('Unexpected JS block count: '+str(checked))
          print('node --check passed for',checked,'script blocks; bytes',len(old),'->',len(s))
          PY
      - name: Exercise tracking and drops
        run: |
          node <<'JS'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const b=html.indexOf('const TRK36=[];'),e=html.indexOf('// ---- 段階F：',b);
          if(b<0||e<b)throw Error('tracker not found');
          const tr=html.slice(b,e);
          const body=[
          "const S={time:10},P={x:0,z:0},spawnerState=[{type:'boar',e:{id:123}}],ET={boar:{name:'イノシシ'}};",
          "const dist=(a,b,c,d)=>Math.hypot(a-c,b-d),compass=(x,z)=>x>.2?'東':'北',toast=()=>{},sfx=()=>{};",
          tr,
          "const e={id:123,type:'boar'},other={id:124,type:'boar'};",
          "const make=i=>{const k={sourceId:123,step:i,kind:'boar',dir:Math.PI/2,t:0,ttl:300,m:{position:{x:i*3,z:0}}};TRK36.push(k);P.x=i*3;return k;};",
          "const a=make(1);trk36Inspect(a);trk36Inspect(a);if(TRK36_TRACK.chain!==1)throw Error('double counted');",
          "S.time=20;trk36Inspect(make(2));S.time=30;trk36Inspect(make(3));",
          "if(TRK36_TRACK.chain!==3||!trk36BonusFor(e)||trk36BonusFor(other))throw Error('tracking/identity');",
          "if(!spawnerState[0].trk36Hint)throw Error('spawner hint');",
          "let n=0;const c={save(){n++},restore(){},translate(){},rotate(){},beginPath(){},moveTo(){},lineTo(){},closePath(){},fill(){},stroke(){}};",
          "trk36Map(c,x=>x,z=>z,()=>{});if(n!==4)throw Error('map markers invisible');",
          "S.time=200;n=0;trk36Map(c,x=>x,z=>z,()=>{});if(n!==0||trk36GenHint()!=='')throw Error('markers not expired');",
          "S.time=400;if(trk36BonusFor(e))throw Error('bonus not expired');",
          "return {chain:3,markersBefore:4,markersAfter:0,expired:true};"].join('\n');
          console.log('TRACK_TEST',JSON.stringify(new Function(body)()));
          const ks=html.indexOf('function killEnemy(e,trackingBonus=0){'),ke=html.indexOf('// ================= 敵AI',ks);
          const kill=html.slice(ks,ke);
          const drop=new Function(
          "const stats={kills:0},got=[],f31Kill=()=>{},spawnDrop=(k,n)=>got.push({k,n}),sfx=()=>{},bossDefeated=()=>{};"+
          kill+
          "const mk=()=>({state:'idle',type:'boar',x:0,z:0,ind:{visible:true},stars:{visible:true},sector:null,ringM:null,carry:null});"+
          "killEnemy(mk(),0);const a=got.find(x=>x.k==='hide').n;got.length=0;killEnemy(mk(),1);const b=got.find(x=>x.k==='hide').n;"+
          "if(a!==2||b!==3||got.some(x=>x.k==='fang'))throw Error('drop mismatch');return {ordinary:a,tracked:b,delta:b-a};"
          )();
          console.log('DROP_TEST',JSON.stringify(drop));
          if(!html.includes("L.slice(0,2).join('')+trk36GenHint()"))throw Error('Gen hint missing');
          if(!html.includes('trk36Map(c,X,Z,lab)'))throw Error('map wiring missing');
          console.log('NO_REGRESSION map/Gen hooks present');
          JS
      - name: Commit only index.html and remove this temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/temporary-apply-tracking.yml
          git add index.html
          git diff --cached --check
          git commit -m "feat: track hoofprints with timed map clues and hunting bonus"
          git push
