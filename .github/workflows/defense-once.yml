name: One-time defense facilities integration
on:
  push:
    paths:
      - '.github/workflows/defense-once.yml'
      - '.github/scripts/defense_once.py'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    concurrency:
      group: defense-once-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply narrow index.html modifications and test every JS block
        run: python3 .github/scripts/defense_once.py
      - name: Commit tested game, remove one-time tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f .github/workflows/defense-once.yml .github/scripts/defense_once.py
          git diff --cached --quiet && exit 1
          git commit -m "Add spike fence, pit trap and buildable scout tower"
          git push
