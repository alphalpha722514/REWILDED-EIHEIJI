name: Apply Nushi dialogue (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-nushi-dialogue-once.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.repository == 'alphalpha722514/REWILDED-EIHEIJI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and patch only index.html
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "94a2ae42995b9ceefd28d1c925a358d0bbe3bca2"
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/nushi.patch
          git apply --check /tmp/nushi.patch
          git apply /tmp/nushi.patch
          test "$(git hash-object index.html)" = "7e8d2ada9a9d0bb2536367ce4b96d3d9dd434b61"
      - name: Commit restored Nushi dialogue
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore player dialogue in Nushi farewell scene"
          git push origin HEAD:main
